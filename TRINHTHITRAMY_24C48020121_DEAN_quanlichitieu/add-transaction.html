<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finora - Thêm Giao Dịch</title>
  <link rel="icon" type="image/png" href="images/favicon-finora.png">
  <link rel="apple-touch-icon" href="images/favicon-finora.png">
  <meta name="theme-color" content="#1e40af">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/main.js"></script>
</head>
<body>

  <!-- Thông báo nổi (toast) -->
  <div id="toastMessage" class="toast" role="status" aria-live="polite">
    <span aria-hidden="true">✅</span>
    <span id="toastText"></span>
  </div>

  <!-- Header & thanh điều hướng -->
  <header class="header">
    <div class="container header-content">
      <a href="index.html" class="logo" aria-label="Finora - Trang chủ">
        <img src="images/navbar-finora.png" alt="Finora - Hiểu tiền, sống chủ động">
      </a>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Mở menu" aria-expanded="false" aria-controls="mainNav">☰</button>
      <nav class="navbar" id="mainNav" aria-label="Menu chính">
        <ul>
          <li><a href="index.html">Tổng quan</a></li>
          <li><a href="transactions.html">Giao dịch</a></li>
          <li><a href="add-transaction.html" class="active" aria-current="page">Thêm mới</a></li>
          <li><a href="budget.html">Ngân sách</a></li>
          <li><a href="reports.html">Báo cáo</a></li>
          <li>
            <button id="themeStoreBtn" class="theme-store-btn" type="button">
              🛍️ Cửa Hàng
              <span class="sparkle-icon sparkle-1" aria-hidden="true">✨</span>
              <span class="sparkle-icon sparkle-2" aria-hidden="true">⭐</span>
            </button>
          </li>
          <li>
            <button id="themeToggleBtn" class="theme-toggle-btn" type="button">🌙 Chế độ tối</button>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <div class="container">
      <div class="form-card">
        <h2 class="form-title">Thêm Giao Dịch Mới</h2>

        <!-- FORM 1: thêm / sửa giao dịch (7 loại input, validation bằng JS) -->
        <form id="transactionForm" novalidate>

          <!-- 1. Radio: loại giao dịch -->
          <fieldset class="form-group form-fieldset">
            <legend class="form-label">Loại giao dịch <span class="required">*</span></legend>
            <div class="radio-group">
              <label class="radio-item" for="typeExpense">
                <input type="radio" id="typeExpense" name="transactionType" value="expense" checked>
                Chi tiêu (khoản tiền chi)
              </label>
              <label class="radio-item" for="typeIncome">
                <input type="radio" id="typeIncome" name="transactionType" value="income">
                Thu nhập (tiền vào ví)
              </label>
            </div>
          </fieldset>

          <!-- 2. Text: tiêu đề -->
          <div class="form-group">
            <label class="form-label" for="transTitle">Tiêu đề giao dịch <span class="required">*</span></label>
            <input type="text" id="transTitle" class="form-control" maxlength="80" placeholder="Ví dụ: Ăn trưa, Tiền thưởng dự án...">
            <span class="error-message" id="transTitleError"></span>
          </div>

          <div class="form-row">
            <!-- 3. Number: số tiền -->
            <div class="form-group">
              <label class="form-label" for="transAmount">Số tiền (VNĐ) <span class="required">*</span></label>
              <input type="number" id="transAmount" class="form-control" placeholder="50000" min="1000">
              <span class="error-message" id="transAmountError"></span>
            </div>

            <!-- 4. Select: danh mục -->
            <div class="form-group">
              <label class="form-label" for="transCategory">Danh mục <span class="required">*</span></label>
              <select id="transCategory" class="form-control">
                <option value="">-- Chọn danh mục --</option>
                <option value="Ăn uống">Ăn uống</option>
                <option value="Học tập">Học tập</option>
                <option value="Nhà ở">Nhà ở</option>
                <option value="Di chuyển">Di chuyển</option>
                <option value="Mua sắm">Mua sắm</option>
                <option value="Lương">Lương</option>
                <option value="Khác">Khác</option>
              </select>
              <span class="error-message" id="transCategoryError"></span>
            </div>
          </div>

          <!-- 5. Date: ngày giao dịch -->
          <div class="form-group">
            <label class="form-label" for="transDate">Ngày giao dịch <span class="required">*</span></label>
            <input type="date" id="transDate" class="form-control">
            <span class="error-message" id="transDateError"></span>
          </div>

          <!-- 6. Textarea: ghi chú -->
          <div class="form-group">
            <label class="form-label" for="transNote">Ghi chú thêm</label>
            <textarea id="transNote" class="form-control" rows="3" maxlength="220" placeholder="Ghi chú chi tiết (không bắt buộc, tối đa 200 ký tự)..."></textarea>
            <span class="error-message" id="transNoteError"></span>
          </div>

          <!-- 7. Checkbox: khoản cố định -->
          <div class="form-group">
            <label class="checkbox-item" for="isRecurring">
              <input type="checkbox" id="isRecurring" value="true">
              Đánh dấu đây là khoản cố định định kỳ hàng tháng
            </label>
          </div>

          <button type="submit" class="btn-submit">💾 Lưu Giao Dịch</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Finora &ndash; Hiểu tiền, sống chủ động.</p>
    </div>
  </footer>

  <!-- Modal Cửa hàng chủ đề -->
  <div class="theme-modal" id="themeModal" role="dialog" aria-modal="true" aria-labelledby="themeModalTitle">
    <div class="theme-modal-content">
      <h3 id="themeModalTitle"> Cửa Hàng Chủ Đề</h3>
      <p class="modal-note">Chọn phong cách giao diện yêu thích cho Finora nhé!</p>
      <div class="theme-grid">
        <button type="button" class="theme-option-card" data-theme-choice="pastel"><strong> Hồng Pastel</strong><small>Hồng ngọt ngào</small></button>
        <button type="button" class="theme-option-card" data-theme-choice="green"><strong> Xa lánh</strong><small>Tài lộc, thịnh vượng</small></button>
        <button type="button" class="theme-option-card" data-theme-choice="sunset"><strong> màu cem</strong><small>Ấm áp, năng động</small></button>
        <button type="button" class="theme-option-card" data-theme-choice="skyblue"><strong> Xanh Nước</strong><small>Thanh lịch, mát mắt</small></button>
      </div>
      <button type="button" id="closeThemeModal" class="btn-outline btn-block">Đóng lại</button>
    </div>
  </div>

  <script src="js/validation.js"></script>
</body>
</html>
